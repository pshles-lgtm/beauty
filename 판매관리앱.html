<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매장 품목 관리</title>
<style>
:root{--a:#586fd2;--ink:#202a3b;--muted:#778196;--line:#e5e9f1;--bg:#f4f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:20px 14px 40px}header,.row,.toolbar,.actions,.prices,.modalhead,.modalfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--a);color:#fff;border-radius:14px;padding:12px;font-size:24px}h1{font-size:clamp(22px,4vw,30px);margin:0}.muted,.hint{font-size:12px;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 13px;font-weight:700}.btn.primary{background:var(--a);color:#fff;border-color:var(--a)}.btn.danger{color:#bf4c5b}.btn.small{font-size:12px;padding:7px 9px}.toolbar{margin-bottom:14px;flex-wrap:wrap}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;outline:none}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:15px}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:18px;margin:0}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px}.cat{border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px 5px;text-align:center}.cat.active{border-color:var(--a);background:#eef1ff}.icon{font-size:28px}.cat b{display:block;font-size:13px;margin-top:7px}.cat small{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}.product{border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.photo{height:180px;background:#f7f8fb;display:grid;place-items:center;cursor:pointer}.photo img{width:100%;height:100%;object-fit:contain}.no-photo{text-align:center;color:#9ba4b5}.no-photo span{font-size:34px;display:block}.info{padding:12px}.name{font-weight:800;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:4px}.prices{display:block;margin-top:10px;font-size:12px}.price{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #eee}.price span{color:var(--muted)}.actions{margin-top:10px}.actions button{flex:1}.empty{grid-column:1/-1;text-align:center;padding:32px;color:var(--muted)}.overlay{display:none;position:fixed;inset:0;background:#17213988;z-index:5;align-items:center;justify-content:center;padding:12px}.overlay.open{display:flex}.modal{width:min(680px,100%);max-height:94vh;overflow:auto;background:white;border-radius:18px}.modalhead{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:2}.modalhead h2{margin:0}.x{border:0;background:#f1f3f8;border-radius:9px;width:35px;height:35px;font-size:21px}.form{padding:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;outline:none}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tile{width:85px;height:85px;position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}.tile button{position:absolute;right:3px;top:3px;border:0;border-radius:50%;background:white;color:#c44;width:23px;height:23px}.modalfoot{padding:13px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}.right{display:flex;gap:8px}.visual{padding:16px}.preview{max-width:100%;max-height:220px;object-fit:contain;display:block;background:#f7f8fb;border-radius:10px;margin-top:12px}.visualgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.vcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white;text-align:left;padding:0}.vcard img{width:100%;height:115px;object-fit:contain;background:#f7f8fb}.vcard div{padding:8px;font-size:12px;font-weight:700}
@media(max-width:650px){.cats{grid-template-columns:repeat(2,1fr);gap:7px;padding:10px}.cat{padding:11px 4px}.products{grid-template-columns:repeat(2,minmax(0,1fr));padding:9px;gap:8px}.photo{height:140px}.info{padding:9px}.name{font-size:14px}.price{font-size:11px}.three{grid-template-columns:1fr}.visualgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:14px 9px}.panelhead{padding:13px}}
@media(max-width:390px){.products{grid-template-columns:1fr}.photo{height:190px}}
</style></head><body>
<div class="app"><header><div class="brand"><div class="logo">▦</div><div><h1>매장 품목 관리</h1><div class="muted">제품 사진과 판매 가격을 관리하세요.</div></div></div><div class="tools"><button class="btn" id="export">백업 내보내기</button><button class="btn" id="import">백업 불러오기</button><input type="file" id="backup" accept=".json" hidden></div></header>
<div class="toolbar"><input class="search" id="search" placeholder="제품 이름 또는 모델명 검색"><button class="btn" id="visualBtn">📷 사진으로 찾기</button><button class="btn primary" id="add">＋ 품목 등록</button></div>
<section class="panel"><div class="panelhead"><h2>품목 구분</h2><span class="muted">품목을 선택하세요</span></div><div class="cats" id="cats"></div></section>
<section class="panel"><div class="panelhead"><div><h2 id="listTitle">전체 제품</h2><div class="muted" id="count"></div></div><button class="btn small" id="all">전체 보기</button></div><div class="products" id="products"></div></section>
<div class="hint">자료는 이 기기의 브라우저에 저장됩니다. 중요한 자료는 백업해 주세요.</div></div>
<div class="overlay" id="editor"><section class="modal"><div class="modalhead"><h2 id="editorTitle">제품 등록</h2><button class="x" data-close="editor">×</button></div><div class="form">
<div class="field"><label>품목 구분</label><select id="category"></select></div><div class="field"><label>제품명 *</label><input id="name" maxlength="100" placeholder="예: 고급 전동 미용의자"></div><div class="field"><label>모델명 / 설명</label><input id="model" maxlength="160" placeholder="모델 번호, 색상, 특징"></div>
<div class="field"><label>제품 사진 (여러 장 등록 가능)</label><div class="tools"><button class="btn small" id="pick">사진 선택</button><button class="btn small" id="shoot">📷 카메라 촬영</button><input type="file" id="photos" accept="image/*" multiple hidden><input type="file" id="capture" accept="image/*" capture="environment" hidden></div><div class="tiles" id="tiles"></div><div class="hint">사진의 × 버튼으로 개별 삭제할 수 있습니다.</div></div>
<div class="field"><label>판매 가격 (원)</label><div class="three"><div><label>도매가</label><input type="number" id="wholesale" min="0" placeholder="0"></div><div><label>소개가</label><input type="number" id="referral" min="0" placeholder="0"></div><div><label>소비자가</label><input type="number" id="retail" min="0" placeholder="0"></div></div></div>
</div><div class="modalfoot"><button class="btn danger" id="delete" style="visibility:hidden">제품 삭제</button><div class="right"><button class="btn" data-close="editor">취소</button><button class="btn primary" id="save">저장하기</button></div></div></section></div>
<div class="overlay" id="visual"><section class="modal"><div class="modalhead"><h2>사진으로 비슷한 제품 찾기</h2><button class="x" data-close="visual">×</button></div><div class="visual"><div class="tools"><button class="btn primary" id="takeQuery">📷 사진 촬영</button><button class="btn" id="pickQuery">사진 선택</button><input type="file" id="queryCamera" accept="image/*" capture="environment" hidden><input type="file" id="queryFile" accept="image/*" hidden></div><p class="hint">촬영한 사진과 등록된 제품 사진을 한 화면에서 비교할 수 있습니다. 현재 버전은 AI 자동 유사도 판정 대신 제품 사진을 모아 보여줍니다.</p><img id="queryPreview" class="preview" hidden alt="검색 사진 미리보기"><h3>등록된 제품 사진</h3><div class="visualgrid" id="visualGrid"></div></div></section></div>
<script>
(()=>{const C=[['미용의자','🪑'],['샴푸대','🚿'],['열기구','♨️'],['셋팅기','💈'],['셋트다이','🪞']],KEY='salon_inventory_manager_v1';let items=[],cat='전체',editId=null,pics=[],queryPic='';
const $=id=>document.getElementById(id),money=v=>Number(v)>0?Number(v).toLocaleString('ko-KR')+'원':'—',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ico=n=>C.find(x=>x[0]===n)?.[1]||'📦';
try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');items=Array.isArray(x)?x:[]}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('저장 공간이 부족합니다. 사진 수를 줄이거나 백업해 주세요.');return false}}
function render(){let cs=$('cats');cs.innerHTML='';[['전체','🗂️'],...C].forEach(([n,i])=>{let count=n==='전체'?items.length:items.filter(p=>p.category===n).length,b=document.createElement('button');b.className='cat'+(cat===n?' active':'');b.innerHTML=`<div class="icon">${i}</div><b>${n}</b><small>${count}개 제품</small>`;b.onclick=()=>{cat=n;render()};cs.appendChild(b)});
let q=$('search').value.trim().toLocaleLowerCase('ko-KR'),list=items.filter(p=>(cat==='전체'||p.category===cat)&&(!q||`${p.name} ${p.model||''} ${p.category}`.toLocaleLowerCase('ko-KR').includes(q)));$('listTitle').textContent=cat==='전체'?'전체 제품':cat;$('count').textContent=`등록된 제품 ${list.length}개`;let box=$('products');box.innerHTML='';
if(!list.length){box.innerHTML='<div class="empty">등록된 제품이 없습니다. 품목 등록 버튼으로 제품을 추가해 주세요.</div>';return}
list.forEach(p=>{let a=document.createElement('article');a.className='product';a.innerHTML=`<div class="photo">${p.photos?.[0]?`<img src="${p.photos[0]}" alt="${esc(p.name)}">`:`<div class="no-photo"><span>${ico(p.category)}</span>사진 없음</div>`}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.category)}${p.model?' · '+esc(p.model):''}${p.photos?.length>1?' · 사진 '+p.photos.length+'장':''}</div><div class="prices"><div class="price"><span>도매가</span><b>${money(p.wholesale)}</b></div><div class="price"><span>소개가</span><b>${money(p.referral)}</b></div><div class="price"><span>소비자가</span><b>${money(p.retail)}</b></div></div><div class="actions"><button class="btn small edit">수정</button><button class="btn small danger remove">삭제</button></div></div>`;a.querySelector('.photo').onclick=()=>openEdit(p.id);a.querySelector('.edit').onclick=()=>openEdit(p.id);a.querySelector('.remove').onclick=()=>remove(p.id);box.appendChild(a)})}
function show(id){$(id).classList.add('open');document.body.style.overflow='hidden'}function close(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.style.overflow=''}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)close(o.id)});
C.forEach(([n])=>{let o=document.createElement('option');o.value=n;o.textContent=n;$('category').appendChild(o)});
function drawTiles(){let box=$('tiles');box.innerHTML='';pics.forEach((src,i)=>{let d=document.createElement('div');d.className='tile';d.innerHTML=`<img src="${src}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>{pics.splice(i,1);drawTiles()};box.appendChild(d)})}
function newItem(){editId=null;pics=[];$('editorTitle').textContent='제품 등록';$('delete').style.visibility='hidden';$('category').value=C.some(x=>x[0]===cat)?cat:C[0][0];['name','model','wholesale','referral','retail'].forEach(id=>$(id).value='');drawTiles();show('editor')}
function openEdit(id){let p=items.find(x=>x.id===id);if(!p)return;editId=id;pics=[...(p.photos||[])];$('editorTitle').textContent='제품 수정';$('delete').style.visibility='visible';$('category').value=p.category;$('name').value=p.name;$('model').value=p.model||'';$('wholesale').value=p.wholesale||'';$('referral').value=p.referral||'';$('retail').value=p.retail||'';drawTiles();show('editor')}
function remove(id){let p=items.find(x=>x.id===id);if(p&&confirm(`"${p.name}" 제품을 삭제할까요?`)){items=items.filter(x=>x.id!==id);persist();render()}}
async function readImage(file){if(!file.type.startsWith('image/'))throw Error('이미지 파일을 선택해 주세요.');return new Promise((res,rej)=>{let r=new FileReader();r.onerror=()=>rej(Error('사진을 읽을 수 없습니다.'));r.onload=()=>{let im=new Image();im.onerror=()=>rej(Error('이미지를 열 수 없습니다.'));im.onload=()=>{let s=Math.min(1,1000/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
async function processFiles(files,where){for(let f of Array.from(files||[])){try{let d=await readImage(f);if(where==='pics')pics.push(d);else queryPic=d}catch(e){alert(e.message)}}if(where==='pics')drawTiles();else renderVisual()}
$('add').onclick=newItem;$('pick').onclick=()=>$('photos').click();$('shoot').onclick=()=>$('capture').click();$('photos').onchange=e=>{processFiles(e.target.files,'pics');e.target.value=''};$('capture').onchange=e=>{processFiles(e.target.files,'pics');e.target.value=''};
$('save').onclick=()=>{let n=$('name').value.trim();if(!n){alert('제품명을 입력해 주세요.');return}let old=items.find(p=>p.id===editId),p={id:editId||uid(),category:$('category').value,name:n,model:$('model').value.trim(),photos:[...pics],wholesale:Number($('wholesale').value)||0,referral:Number($('referral').value)||0,retail:Number($('retail').value)||0,createdAt:old?.createdAt||new Date().toISOString()};if(old)items=items.map(x=>x.id===editId?p:x);else items.unshift(p);if(persist()){cat=p.category;close('editor');render()}};
$('delete').onclick=()=>{if(editId)remove(editId);close('editor')};$('search').oninput=render;$('all').onclick=()=>{cat='전체';$('search').value='';render()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'매장 품목 관리',version:1,items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='매장품목_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('backup').click();$('backup').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.items))throw Error();if(confirm('현재 자료를 백업 내용으로 교체할까요?')){items=obj.items;persist();render();alert('백업을 불러왔습니다')}}catch(err){alert('올바른 백업 파일이 아닙니다')}e.target.value=''};
function openVisual(){queryPic='';$('queryPreview').hidden=true;renderVisual();show('visual')}$('visualBtn').onclick=openVisual;$('takeQuery').onclick=()=>$('queryCamera').click();$('pickQuery').onclick=()=>$('queryFile').click();$('queryCamera').onchange=e=>{processFiles(e.target.files,'query');e.target.value=''};$('queryFile').onchange=e=>{processFiles(e.target.files,'query');e.target.value=''};
function renderVisual(){let img=$('queryPreview');if(queryPic){img.src=queryPic;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')}let box=$('visualGrid');box.innerHTML='';let list=items.filter(p=>p.photos?.length).sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(!list.length){box.innerHTML='<div class="empty">비교할 사진이 없습니다. 먼저 제품을 등록하고 사진을 추가해 주세요.</div>';return}list.forEach(p=>{let b=document.createElement('button');b.className='vcard';b.innerHTML=`<img src="${p.photos[0]}" alt="${esc(p.name)}"><div>${esc(p.name)}<br><span style="font-weight:400;color:#778196">${esc(p.category)}</span></div>`;b.onclick=()=>{close('visual');openEdit(p.id)};box.appendChild(b)})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close('editor');close('visual')}});render();
})();
</script></body></html>
